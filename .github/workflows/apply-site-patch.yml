name: Apply site patch

on:
  push:
    branches: [main]
    paths:
      - 'patch_site.py'
      - '.github/workflows/apply-site-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch site
        run: python patch_site.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html news-illumination.html news-lost.html news-recruit.html news-tomorrow.html
          git diff --cached --quiet || git commit -m 'Update horror progression and information articles'
          git push
