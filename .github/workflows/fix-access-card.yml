name: Fix access card layout

on:
  push:
    branches: [main]
    paths:
      - 'patch_fix_access_card.py'
      - '.github/workflows/fix-access-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch index
        run: python patch_fix_access_card.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix access card layout during night effects'
          git push
